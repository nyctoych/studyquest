<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="StudyQuest - Transforming psychology study workloads into daily quests, XP progression, boss battles, and realm chronicles." />
  <title>StudyQuest — Transform Workloads into Quests</title>
  <script>
    (function () {
      try {
        var user = null;
        try { user = JSON.parse(localStorage.getItem('sq_user') || 'null'); } catch (_) { }
        var hash = (window.location.hash || '').replace(/^#/, '').split('?')[0];
        var excludedRoutes = ['', '/', '/login', '/register', '/character-selection', '/tutorial'];
        var isExcluded = excludedRoutes.indexOf(hash) !== -1;
        var isNewPlayer = user && (user.is_new_player === 1 || user.is_new_player === true || user.is_new_player === '1');

        var t = 'night';
        var isPublicThemeable = hash.toLowerCase() === '/home' || hash.toLowerCase() === '/terms' || hash.toLowerCase() === '/privacy';
        if (isPublicThemeable) {
          var saved = localStorage.getItem('studyquest_theme');
          if (saved === 'morning') t = 'morning';
        } else if (user && !isNewPlayer && !isExcluded) {
          var saved = localStorage.getItem('studyquest_theme');
          if (saved === 'morning') t = 'morning';
        }

        document.documentElement.setAttribute('data-theme', t);
        if (t === 'morning') {
          document.documentElement.classList.add('theme-morning');
          document.documentElement.classList.remove('theme-night');
        } else {
          document.documentElement.classList.add('theme-night');
          document.documentElement.classList.remove('theme-morning');
        }
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
